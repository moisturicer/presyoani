<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PresyoAni Live Scan</title>
    <link rel="manifest" href="/static/manifest.json">
    <script src="/static/tf.min.js"></script>
    <script src="/static/tf-tflite.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #000; color: white; overflow: hidden; }
        #camera-container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .controls { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; box-sizing: border-box; background: linear-gradient(transparent, rgba(0,0,0,0.8)); }
        .card { background: white; color: black; padding: 20px; border-radius: 20px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .btn { background: #2ecc71; color: white; padding: 15px; border: none; border-radius: 50px; width: 100%; font-weight: bold; font-size: 18px; cursor: pointer; }
        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:100; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* RESULT OVERLAY */
        #result-overlay { 
            display: none; /* Hidden by default */
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); 
            z-index: 9999; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            padding: 20px; 
            box-sizing: border-box; 
        }
        .result-card { background: white; color: black; padding: 30px; border-radius: 25px; text-align: center; width: 100%; max-width: 400px; }
        .grade-text { font-size: 48px; font-weight: bold; color: #2ecc71; margin: 10px 0; }
        .messenger-btn { 
            display: block; 
            background: #0084ff; 
            color: white; 
            padding: 18px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 18px; 
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="loading">
    <div style="border: 4px solid #f3f3f3; border-top: 4px solid #2ecc71; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite;"></div>
    <p>Initializing AI...</p>
</div>

<!-- SUCCESS CARD -->
<div id="result-overlay">
    <div class="result-card">
        <p style="color: #666; margin: 0;">SCAN COMPLETE</p>
        <div id="display-grade" class="grade-text">GRADE A</div>
        <p id="display-details" style="color: #333;">Tomato • 5kg</p>
        
        <a id="messenger-link" href="#" class="messenger-btn">
            SEND TO MESSENGER
        </a>
        
        <button onclick="location.reload()" style="background:none; border:none; color:#888; margin-top:20px; text-decoration:underline;">Scan again</button>
    </div>
</div>

<div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <div class="controls">
        <div class="card">
            <select id="crop-type">
                <option value="tomato">Tomato</option>
                <option value="chili">Chili</option>
                <option value="sweet_potato">Sweet Potato</option>
            </select>
            <input type="number" id="quantity" placeholder="Weight in kg" inputmode="decimal">
            <button class="btn" id="scan-btn">⚡ SCAN & SEND</button>
        </div>
    </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }

    let model;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const PAGE_ID = "{{ fb_page_id }}";

    async function init() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
            });
            video.srcObject = stream;
            tflite.setWasmPath('/static/');
            model = await tflite.loadTFLiteModel('/static/model.tflite');
            document.getElementById('loading').style.display = 'none';
        } catch (err) {
            console.error(err);
            alert("Camera error. Please refresh.");
        }
    }

    document.getElementById('scan-btn').addEventListener('click', async () => {
        const qty = document.getElementById('quantity').value;
        const crop = document.getElementById('crop-type').value;
        if (!qty || qty <= 0) return alert("Enter weight!");

        document.getElementById('scan-btn').innerText = "Analyzing...";

        const ctx = canvas.getContext('2d');
        canvas.width = 416; canvas.height = 416;
        ctx.drawImage(video, 0, 0, 416, 416);

        const tensor = tf.tidy(() => tf.browser.fromPixels(canvas).div(255.0).expandDims(0));
        const prediction = await model.predict(tensor);
        const data = await prediction.data();

        let maxFresh = 0, maxRotten = 0;
        for (let i = 0; i < 3549; i++) {
            maxFresh = Math.max(maxFresh, data[4*3549+i], data[7*3549+i]); 
            maxRotten = Math.max(maxRotten, data[5*3549+i], data[6*3549+i], data[8*3549+i]);
        }

        if (Math.max(maxFresh, maxRotten) < 0.35) {
            document.getElementById('scan-btn').innerText = "⚡ SCAN & SEND";
            return alert("AI could not find the crop.");
        }

        let grade = "D";
        if (maxFresh > 0.80) grade = "A";
        else if (maxFresh > 0.50) grade = "B"; 
        else if (maxFresh > 0.30) grade = "C";

        const rawData = `${crop}|${qty}|${grade}`;
        // Base64 without '=' padding (Facebook ref is strict)
        let safeHash = btoa(rawData).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');

        // THE ONLY LINK THAT WORKS ON FREE DATA & TRIGGERS REFERRALS
        const mMeUrl = `https://m.me/${PAGE_ID}?ref=${safeHash}`;

        const messengerBtn = document.getElementById('messenger-link');
        messengerBtn.href = mMeUrl;
        
        // This attribute is CRITICAL for PWAs to hand off the ref data to the system browser
        messengerBtn.setAttribute('rel', 'noreferrer');

        // Show the UI Card
        document.getElementById('display-grade').innerText = `GRADE ${grade}`;
        document.getElementById('display-details').innerText = `${qty}kg of ${crop}`;
        document.getElementById('result-overlay').style.display = 'flex';
        document.getElementById('scan-btn').innerText = "⚡ SCAN & SEND";
    });

    init();
</script>
</body>
</html>
