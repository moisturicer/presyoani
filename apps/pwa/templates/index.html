<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PresyoAni Live Scan</title>
    <link rel="manifest" href="/static/manifest.json">
    <script src="/static/tf.min.js"></script>
    <script src="/static/tf-tflite.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #000; color: white; overflow: hidden; }
        #camera-container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .controls { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; box-sizing: border-box; background: linear-gradient(transparent, rgba(0,0,0,0.8)); }
        .card { background: white; color: black; padding: 20px; border-radius: 20px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .btn { background: #2ecc71; color: white; padding: 15px; border: none; border-radius: 50px; width: 100%; font-weight: bold; font-size: 18px; }
        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:100; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loading">
    <div style="border: 4px solid #f3f3f3; border-top: 4px solid #2ecc71; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite;"></div>
    <p>Initializing Offline AI...</p>
</div>

<div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <div class="controls">
        <div class="card">
            <select id="crop-type">
                <option value="tomato">Tomato</option>
                <option value="chili">Chili</option>
                <option value="sweet_potato">Sweet Potato</option>
            </select>
            <input type="number" id="quantity" placeholder="Weight in kg (e.g. 5.5)" inputmode="decimal">
            <button class="btn" id="scan-btn">⚡ SCAN & SEND</button>
        </div>
    </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    // 1. REGISTER SERVICE WORKER (This makes it work without internet)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js');
        });
    }

    let model;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const PAGE_ID = "{{ fb_page_id }}";

    async function init() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
            });
            video.srcObject = stream;
            tflite.setWasmPath('/static/');
            model = await tflite.loadTFLiteModel('/static/model.tflite');
            document.getElementById('loading').style.display = 'none';
        } catch (err) {
            console.error(err);
            alert("Scanner Error: Ensure you have granted camera permissions.");
        }
    }

document.getElementById('scan-btn').addEventListener('click', async () => {
        const qty = document.getElementById('quantity').value;
        const crop = document.getElementById('crop-type').value;
        if (!qty || qty <= 0) return alert("Please enter weight first!");

        // capture image
        const ctx = canvas.getContext('2d');
        canvas.width = 416; canvas.height = 416;
        ctx.drawImage(video, 0, 0, 416, 416);

        // AI prediction
        const tensor = tf.tidy(() => tf.browser.fromPixels(canvas).div(255.0).expandDims(0));
        const prediction = await model.predict(tensor);
        const data = await prediction.data();

        // Parse prediction results
        let maxFresh = 0, maxRotten = 0;
        for (let i = 0; i < 3549; i++) {
            // Assuming your model classes: [..., Fresh, Rotten, ...]
            // We take the highest confidence score found in the AI output
            maxFresh = Math.max(maxFresh, data[4*3549+i], data[7*3549+i]); 
            maxRotten = Math.max(maxRotten, data[5*3549+i], data[6*3549+i], data[8*3549+i]);
        }

        // --- THE "FALSE REDIRECT" FIX ---
        
        // 1. STRICT THRESHOLD: If confidence is lower than 40%, assume nothing is there
        const confidenceScore = Math.max(maxFresh, maxRotten);
        if (confidenceScore < 0.40) {
            return alert(`AI Error: Wala nako nakita nga ${crop}. Palihog paduol sa camera or tarunga ang suga.`);
        }

        // 2. ROTTEN CHECK: If it looks more rotten than fresh
        if (maxRotten > maxFresh && maxRotten > 0.45) {
            return alert("REJECTED: Produce appears rotten or damaged. Dili nimo ni mabaligya.");
        }

        // 3. ASSIGN GRADE
        let grade = "D";
        if (maxFresh > 0.85) grade = "A";      // Very strict for Grade A
        else if (maxFresh > 0.65) grade = "B"; 
        else if (maxFresh > 0.40) grade = "C";
        else grade = "D";

        // Generate Ref Data
        const rawData = `${crop}|${qty}|${grade}`;
        let safeHash = btoa(rawData).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');

        // --- REDIRECT LOGIC ---
        const androidIntent = `intent://user-thread/${PAGE_ID}?ref=${safeHash}#Intent;scheme=fb-messenger;package=com.facebook.orca;end`;
        const iosDeepLink = `fb-messenger://user-thread/${PAGE_ID}?ref=${safeHash}`;
        const mMeUrl = `https://m.me/${PAGE_ID}?ref=${safeHash}`;
        

        if (/android/i.test(navigator.userAgent)) {
            window.location.href = androidIntent;
        } else if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
            window.location.href = iosDeepLink;
        } else {
            window.location.href = mMeUrl;
        }

        // Fallback
        setTimeout(() => { if(!document.hidden) window.location.href = mMeUrl; }, 1500);
    });
    init();
</script>
</body>
</html>
