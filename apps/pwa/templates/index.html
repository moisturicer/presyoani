<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PresyoAni Live Scan</title>
    <script src="/static/tf.min.js"></script>
    <script src="/static/tf-tflite.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background: #000;
            color: white;
            overflow: hidden;
        }

        #camera-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
        }

        .card {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 20px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .btn {
            background: #2ecc71;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 50px;
            width: 100%;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #result-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .result-card {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .hash-code {
            font-size: 36px;
            font-weight: bold;
            color: #0084ff;
            letter-spacing: 5px;
            margin: 15px 0;
            border: 2px dashed #0084ff;
            padding: 10px;
            border-radius: 10px;
        }

        .messenger-btn {
            display: block;
            background: #0084ff;
            color: white;
            padding: 18px;
            border: none;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
            width: 100%;
            cursor: pointer;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div id="loading">
        <div
            style="border: 4px solid #f3f3f3; border-top: 4px solid #2ecc71; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite;">
        </div>
        <p>Initializing AI...</p>
    </div>

    <div id="result-overlay">
        <div class="result-card">
            <p style="color: #666; margin: 0;">SCAN COMPLETE</p>
            <div id="display-code" class="hash-code">------</div>
            <p id="display-details" style="color: #333;">Analyzing...</p>

            <button id="copy-btn" class="messenger-btn">
                COPY CODE & OPEN MESSENGER
            </button>

            <button onclick="location.reload()"
                style="background:none; border:none; color:#888; margin-top:20px; text-decoration:underline;">Scan
                again</button>
        </div>
    </div>

    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        <div class="controls">
            <div class="card">
                <select id="crop-type">
                    <option value="tomato">Tomato</option>
                    <option value="chili">Chili</option>
                    <option value="sweet_potato">Sweet Potato</option>
                </select>
                <input type="number" id="quantity" placeholder="Weight in kg" inputmode="decimal">
                <button class="btn" id="scan-btn">⚡ SCAN & SEND</button>
            </div>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        let model;
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const PAGE_ID = "{{ fb_page_id }}";

        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                tflite.setWasmPath('/static/');
                model = await tflite.loadTFLiteModel('/static/model.tflite');
                document.getElementById('loading').style.display = 'none';
            } catch (err) { alert("Camera error."); }
        }

        document.getElementById('scan-btn').addEventListener('click', async () => {
            const qty = document.getElementById('quantity').value;
            const crop = document.getElementById('crop-type').value;
            if (!qty || qty <= 0) return alert("Enter weight!");

            document.getElementById('scan-btn').innerText = "Analyzing...";

            const ctx = canvas.getContext('2d');
            canvas.width = 416; canvas.height = 416;
            ctx.drawImage(video, 0, 0, 416, 416);

            const tensor = tf.tidy(() => tf.browser.fromPixels(canvas).div(255.0).expandDims(0));
            const prediction = await model.predict(tensor);
            const data = await prediction.data();

            let maxFresh = 0;
            for (let i = 0; i < 3549; i++) { maxFresh = Math.max(maxFresh, data[4 * 3549 + i]); }

            let grade = "C";
            if (maxFresh > 0.80) grade = "A"; else if (maxFresh > 0.50) grade = "B";

            try {
                // Register scan in backend to get the Hashkey
                const response = await fetch('/register-scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ crop, weight: qty, grade })
                });
                const result = await response.json();
                const scanCode = result.scan_code;

                // Show Pop-out
                document.getElementById('display-code').innerText = scanCode;
                document.getElementById('display-details').innerText = `${qty}kg ${crop} (Grade ${grade})`;
                document.getElementById('result-overlay').style.display = 'flex';

                const copyBtn = document.getElementById('copy-btn');
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(scanCode);
                    alert("Code copied! Paste it in the Messenger chat.");
                    window.location.href = `fb-messenger://user-thread/${PAGE_ID}`;
                };
            } catch (e) { alert("Error generating code."); }

            document.getElementById('scan-btn').innerText = "⚡ SCAN & SEND";
        });

        init();
    </script>
</body>

</html>
