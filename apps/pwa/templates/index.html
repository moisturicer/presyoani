<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PresyoAni Offline Scanner</title>
    <link rel="manifest" href="/static/manifest.json">
    <script src="/static/tf.min.js"></script>
    <script src="/static/tf-tflite.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #000; color: white; overflow: hidden; }
        #camera-container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .controls { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; box-sizing: border-box; background: linear-gradient(transparent, rgba(0,0,0,0.9)); }
        .card { background: white; color: black; padding: 20px; border-radius: 20px; box-shadow: 0 -5px 15px rgba(0,0,0,0.3); }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .btn { background: #2ecc71; color: white; padding: 15px; border: none; border-radius: 50px; width: 100%; font-weight: bold; font-size: 18px; cursor: pointer; }

        /* Result Box Styling */
        #result-box { display: none; background: #f9f9f9; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 2px dashed #2ecc71; }
        .code-display { display: flex; gap: 5px; margin-top: 8px; }
        #share-code { flex-grow: 1; font-family: monospace; background: #eee; border: 1px solid #ddd; padding: 10px; border-radius: 5px; font-size: 14px; text-align: center; }
        #copy-btn { background: #34495e; color: white; border: none; padding: 10px; border-radius: 5px; width: 70px; font-size: 12px; }

        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:100; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loading">
    <div style="border: 4px solid #f3f3f3; border-top: 4px solid #2ecc71; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite;"></div>
    <p>Loading Offline AI...</p>
</div>

<div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <div class="controls">
        <div class="card">
            <!-- result box after scan -->
            <div id="result-box">
                <p style="margin:0; font-size:13px; font-weight:bold; color:#27ae60;">✔ SCAN COMPLETE</p>
                <p style="margin:5px 0; font-size:11px; color:#666;">Copy this code and paste it in Messenger:</p>
                <div class="code-display">
                    <input type="text" id="share-code" readonly>
                    <button id="copy-btn">COPY</button>
                </div>
            </div>

            <select id="crop-type">
                <option value="tomato">Tomato (Kamatis)</option>
                <option value="chili">Chili (Sili)</option>
                <option value="sweet_potato">Sweet Potato (Kamote)</option>
            </select>
            <input type="number" id="quantity" placeholder="Weight in kg (e.g. 5.5)" inputmode="decimal">
            <button class="btn" id="scan-btn">⚡ SCAN & GENERATE CODE</button>
        </div>
    </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    // register service worker for offline access
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js');
        });
    }

    let model;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    async function init() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
            });
            video.srcObject = stream;
            tflite.setWasmPath('/static/');
            model = await tflite.loadTFLiteModel('/static/model.tflite');
            document.getElementById('loading').style.display = 'none';
        } catch (err) {
            console.error(err);
            alert("Scanner Error: Grant camera permissions and reload.");
        }
    }

    document.getElementById('scan-btn').addEventListener('click', async () => {
        const qty = document.getElementById('quantity').value;
        const crop = document.getElementById('crop-type').value;
        if (!qty || qty <= 0) return alert("Please enter weight first!");

        const ctx = canvas.getContext('2d');
        canvas.width = 416; canvas.height = 416;
        ctx.drawImage(video, 0, 0, 416, 416);

        const tensor = tf.tidy(() => tf.browser.fromPixels(canvas).div(255.0).expandDims(0));
        const prediction = await model.predict(tensor);
        const data = await prediction.data();

        let maxFresh = 0, maxRotten = 0;
        for (let i = 0; i < 3549; i++) {
            maxFresh = Math.max(maxFresh, data[4*3549+i], data[7*3549+i]);
            maxRotten = Math.max(maxRotten, data[5*3549+i], data[6*3549+i], data[8*3549+i]);
        }

        if (maxFresh < 0.25 && maxRotten < 0.25) return alert("AI cannot see the crop clearly.");
        if (maxRotten > maxFresh && maxRotten > 0.40) return alert("REJECTED: Produce is rotten.");

        let grade = "C";
        if (maxFresh > 0.75) grade = "A";
        else if (maxFresh > 0.45) grade = "B";

        // generate code
        const rawData = `${crop}|${qty}|${grade}`;
        const safeHash = btoa(rawData).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');

        // show UI and copy
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('share-code').value = safeHash;

        navigator.clipboard.writeText(safeHash);
        alert("Code Copied! Paste it in Messenger.");
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
        const codeField = document.getElementById('share-code');
        codeField.select();
        navigator.clipboard.writeText(codeField.value);
        alert("Copied to clipboard!");
    });

    init();
</script>
</body>
</html>
